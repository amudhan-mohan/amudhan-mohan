<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400" role="img" aria-label="One hour of a free Render app. Without RenderPing it sleeps after 15 idle minutes; with RenderPing a ping every 10 minutes keeps it green.">
<defs><filter id="wob2" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/><feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.27  0 0 0 0 0.18  0.35 0 0 0 -0.09"/></filter></defs>
<rect width="1160" height="400" rx="18" fill="#f7f0df"/><rect width="1160" height="400" rx="18" filter="url(#grain)"/>
<text x="40" y="54" font-family="Georgia,'Palatino Linotype',Palatino,'Noto Serif',serif" font-size="26" font-weight="bold" font-style="normal" fill="#3a2d28" text-anchor="start">One hour of a free Render app</text>
<line x1="460.0" y1="36" x2="460.0" y2="352" stroke="#c4372c" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
<text x="476.0" y="54" font-family="Georgia,'Palatino Linotype',Palatino,'Noto Serif',serif" font-size="15.5" font-weight="normal" font-style="italic" fill="#c4372c" text-anchor="start">Render sleeps after 15 idle minutes</text>
