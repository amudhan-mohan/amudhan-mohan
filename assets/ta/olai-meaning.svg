<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 373" width="1160" height="373" role="img" aria-label="திருக்குறள் 329  ·  கொல்லாமை  (அறத்துப்பால்). மு. வரதராசனார்: கொலைத்தொழிலினராகிய மக்கள் அதன் இழிவை ஆராய்ந்தவரிடத்தில் புலைத்தொழிலுடையவராய்த் தாழ்ந்து தோன்றுவர். சாலமன் பாப்பையா: கொலை செய்வதைத் தொழிலாகக் கொண்டு வாழும் மக்கள், அத்தொழிலின் தீமையை அறியாதவர் என்றாலும், அறிந்த பெரியோர் மனத்துள் அவர்கள் கீழான செயல் செய்பவராய் எண்ணப்படுவார்.">
