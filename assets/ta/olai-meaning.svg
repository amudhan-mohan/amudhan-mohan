<text x="96" y="104" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="14.5" font-weight="bold" fill="#2f6a42" text-anchor="start">மு. வரதராசனார் விளக்கம்</text>
<text x="96" y="134" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="18.0" fill="#3a2d28" text-anchor="start">நிலையில்லாதவைகளை நிலையானவை என்று மயங்கி உணரும் புல்லறிவு உடையவராக இருத்தல்</text>
<text x="96" y="163" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="18.0" fill="#3a2d28" text-anchor="start">வாழ்க்கையில் இழிந்த நிலையாகும்.</text>
<text x="96" y="206" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="14.5" font-weight="bold" fill="#2f6a42" text-anchor="start">சாலமன் பாப்பையா விளக்கம்</text>
<text x="96" y="236" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="18.0" fill="#3a2d28" text-anchor="start">நிலை இல்லாத பொருள்களை நிலையானவை என்று எண்ணும் அற்ப அழிவு இழிவானது.</text>
