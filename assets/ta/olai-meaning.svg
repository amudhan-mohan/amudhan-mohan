<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 315" width="1160" height="315" role="img" aria-label="திருக்குறள் 331  ·  நிலையாமை  (அறத்துப்பால்). மு. வரதராசனார்: நிலையில்லாதவைகளை நிலையானவை என்று மயங்கி உணரும் புல்லறிவு உடையவராக இருத்தல் வாழ்க்கையில் இழிந்த நிலையாகும். சாலமன் பாப்பையா: நிலை இல்லாத பொருள்களை நிலையானவை என்று எண்ணும் அற்ப அழிவு இழிவானது.">
