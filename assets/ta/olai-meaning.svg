<path d="M96 68 q160 5 320 -2" fill="none" stroke="#e8a621" stroke-width="2.6" stroke-linecap="round" filter="url(#wob2)"/>
<text x="96" y="104" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="14.5" font-weight="bold" fill="#2f6a42" text-anchor="start">மு. வரதராசனார் விளக்கம்</text>
<text x="96" y="134" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="18.0" fill="#3a2d28" text-anchor="start">கொலைத்தொழிலினராகிய மக்கள் அதன் இழிவை ஆராய்ந்தவரிடத்தில்</text>
<text x="96" y="163" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="18.0" fill="#3a2d28" text-anchor="start">புலைத்தொழிலுடையவராய்த் தாழ்ந்து தோன்றுவர்.</text>
<text x="96" y="206" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="14.5" font-weight="bold" fill="#2f6a42" text-anchor="start">சாலமன் பாப்பையா விளக்கம்</text>
<text x="96" y="236" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="18.0" fill="#3a2d28" text-anchor="start">கொலை செய்வதைத் தொழிலாகக் கொண்டு வாழும் மக்கள், அத்தொழிலின் தீமையை அறியாதவர்</text>
<text x="96" y="265" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="18.0" fill="#3a2d28" text-anchor="start">என்றாலும், அறிந்த பெரியோர் மனத்துள் அவர்கள் கீழான செயல் செய்பவராய்</text>
<text x="96" y="294" font-family="&#x27;Noto Sans Tamil&#x27;,&#x27;Nirmala UI&#x27;,Latha,&#x27;Tamil Sangam MN&#x27;,&#x27;Noto Sans&#x27;,sans-serif" font-size="18.0" fill="#3a2d28" text-anchor="start">எண்ணப்படுவார்.</text>
</svg>