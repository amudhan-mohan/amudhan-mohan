<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 286" width="1160" height="286" role="img" aria-label="இணையதளம் வேண்டுமா? மென்பொருள் பணி &amp; இணையதளங்களுக்குத் தயார். முதல் வரைபடம் முதல் இணையத்தில் வெளியிடும் வரை உருவாக்குகிறேன். பேசலாம்.">
<defs><filter id="wob" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="wob2" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/><feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.27  0 0 0 0 0.18  0.35 0 0 0 -0.09"/></filter><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur stdDeviation="5"/></filter></defs>
<path d="M150 0 L170 40 M1010 0 L990 40" stroke="#8a6a4a" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#wob2)"/>
<rect x="56" y="36" width="1048" height="226" rx="12" fill="#00000030" filter="url(#soft)"/>
<rect x="60" y="34" width="1040" height="220" rx="10" fill="#2d3b6b" filter="url(#wob)"/>
<rect x="60" y="34" width="1040" height="220" rx="10" filter="url(#grain)"/>
<rect x="78" y="52" width="1004" height="184" rx="6" fill="none" stroke="#e8a621" stroke-width="3" stroke-dasharray="14 7" filter="url(#wob2)"/>
<g transform="translate(108 66)"><rect width="444" height="28" rx="14" fill="#2f6a42" stroke="#9cc07a" stroke-width="1.6" filter="url(#wob2)"/><circle cx="16" cy="14" r="4.5" fill="#9cc07a"><animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/></circle><text x="29" y="18.5" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#fffaf0" text-anchor="start">மென்பொருள் பணி &amp; இணையதளங்களுக்குத் தயார்</text></g>
<text x="108" y="140" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="37" font-weight="bold" fill="#e8a621" text-anchor="start">இணையதளம் வேண்டுமா?</text>
<text x="108" y="176" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="16" fill="#f3e9d2" text-anchor="start">முதல் வரைபடம் முதல் இணையத்தில் வெளியிடும் வரை,</text>
<text x="108" y="201" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="16" fill="#e9d8a6" text-anchor="start">வாடிக்கையாளர்களுக்கான இணையதளங்களை உருவாக்குகிறேன்.</text>
<g transform="translate(940 144) rotate(-8)"><g><animateTransform attributeName="transform" type="scale" values="1.7;1;1" keyTimes="0;0.25;1" dur="6s" begin="0.8s" repeatCount="indefinite"/><circle r="62" fill="none" stroke="#c4372c" stroke-width="6" filter="url(#wob)"/><circle r="51" fill="none" stroke="#c4372c" stroke-width="2" stroke-dasharray="3 6"/><circle r="62" fill="#c4372c" opacity="0.14"/><text x="0" y="8" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="22" font-weight="bold" fill="#ff8a7d" text-anchor="middle">பேசலாம்</text></g></g>
</svg>