<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.000;0.040;0.293;0.333;1.000" values="0;1;1;0;0"/><text x="60" y="238" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="25.5" font-weight="bold" fill="#2f6a42" text-anchor="start">மாணவர்களுக்கான கருவிகளை உருவாக்குகிறேன்.</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.000;0.333;0.373;0.627;0.667;1.000" values="0;0;1;1;0;0"/><text x="60" y="238" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="26.5" font-weight="bold" fill="#2f6a42" text-anchor="start">உறங்கும் சர்வர்களை விழித்திருக்கச் செய்கிறேன்.</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.000;0.667;0.707;0.960;1.000" values="0;0;1;1;0"/><text x="60" y="238" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="21.0" font-weight="bold" fill="#2f6a42" text-anchor="start">வாடிக்கையாளர்களுக்கு இணையதளங்கள் உருவாக்குகிறேன்.</text></g>
