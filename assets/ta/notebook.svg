<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="என் குறிப்பேடு: வணக்கம், நான் அமுதன். அண்ணாமலைப் பல்கலைக்கழகத்தில் B.E. CSE முடித்துள்ளேன்.">
<defs><filter id="wob2" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
