<circle cx="38" cy="100" r="11" fill="#efe3c8" stroke="#bfae8c" stroke-width="2"/><circle cx="38" cy="200" r="11" fill="#efe3c8" stroke="#bfae8c" stroke-width="2"/><circle cx="38" cy="300" r="11" fill="#efe3c8" stroke="#bfae8c" stroke-width="2"/>
