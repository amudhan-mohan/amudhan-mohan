<text x="104" y="62" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="28" font-weight="bold" fill="#c4372c" text-anchor="start">என் குறிப்பேடு</text>
<path d="M104 72 q110 7 210 -2" fill="none" stroke="#c4372c" stroke-width="3" stroke-linecap="round" filter="url(#wob2)"/>
<clipPath id="c0"><rect x="100" y="74" height="42" width="0"><animate attributeName="width" from="0" to="780" dur="0.45s" begin="0.1s" fill="freeze"/></rect></clipPath><text x="104" y="104" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="22" font-weight="bold" fill="#2f6a42" text-anchor="start" clip-path="url(#c0)">வணக்கம், நான் அமுதன்.</text>
<clipPath id="c1"><rect x="100" y="118" height="42" width="0"><animate attributeName="width" from="0" to="780" dur="0.45s" begin="0.4s" fill="freeze"/></rect></clipPath><text x="104" y="148" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN',sans-serif" font-size="20.5" fill="#3a2d28" text-anchor="start" clip-path="url(#c1)">அண்ணாமலைப் பல்கலைக்கழகத்தில் B.E. CSE முடித்துள்ளேன்.</text>
<clipPath id="c2"><rect x="100" y="162" height="42" width="0"><animate attributeName="width" from="0" to="780" dur="0.45s" begin="0.7s" fill="freeze"/></rect></clipPath><text x="104" y="192" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="21" fill="#3a2d28" text-anchor="start" clip-path="url(#c2)">சிறிய, பயனுள்ள மென்பொருள்களை உருவாக்க எனக்குப் பிடிக்கும்,</text>
<clipPath id="c3"><rect x="100" y="206" height="42" width="0"><animate attributeName="width" from="0" to="780" dur="0.45s" begin="1.0s" fill="freeze"/></rect></clipPath><text x="104" y="236" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="21" fill="#3a2d28" text-anchor="start" clip-path="url(#c3)">பெரும்பாலும் மாணவர்களுக்கும் சக டெவலப்பர்களுக்கும்.</text>
<clipPath id="c4"><rect x="100" y="250" height="42" width="0"><animate attributeName="width" from="0" to="780" dur="0.45s" begin="1.3s" fill="freeze"/></rect></clipPath><text x="104" y="280" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="21" fill="#3a2d28" text-anchor="start" clip-path="url(#c4)">வாடிக்கையாளர்களுக்கும் இணையதளங்கள் உருவாக்குகிறேன்.</text>
<clipPath id="c5"><rect x="100" y="294" height="42" width="0"><animate attributeName="width" from="0" to="780" dur="0.45s" begin="1.6s" fill="freeze"/></rect></clipPath><text x="104" y="324" font-family="'Noto Sans Tamil','Nirmala UI',Latha,'Tamil Sangam MN','Noto Sans',sans-serif" font-size="21" fill="#2f6a42" text-anchor="start" clip-path="url(#c5)">எல்லாமே முழுமையாக முடிக்கப்பட்டு வெளியாகின்றன.</text>
