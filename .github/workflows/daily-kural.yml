name: Daily Profile & Thirukkural Update

on:
  schedule:
    # Runs daily at 00:00 IST (18:30 UTC)
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      kural_number:
        description: 'Optional kural number (1-1330) to render'
        required: false
        type: string
      availability:
        description: 'Optional signboard status override (open, freelance, busy)'
        required: false
        type: choice
        options:
          - ''
          - open
          - freelance
          - busy

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update hero header SVGs (festival calendar check)
        run: python .github/scripts/update_header.py

      - name: Update signboard SVGs (availability badge)
        env:
          AVAILABILITY: ${{ inputs.availability }}
        run: |
          if [ -n "$AVAILABILITY" ]; then
            python .github/scripts/update_signboard.py --status "$AVAILABILITY"
          else
            python .github/scripts/update_signboard.py
          fi

      - name: Update daily Thirukkural Olai SVGs and meaning cards
        env:
          KURAL_NUMBER: ${{ inputs.kural_number }}
        run: |
          if [ -n "$KURAL_NUMBER" ]; then
            python .github/scripts/update_olai.py --kural "$KURAL_NUMBER"
          else
            python .github/scripts/update_olai.py
          fi

      - name: Update live GitHub project metrics & pulse SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_pulse.py

      - name: Update GitHub contribution calendar, account age & achievements SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_METRICS_TOKEN: ${{ secrets.GH_METRICS_TOKEN }}
        run: python .github/scripts/update_contributions.py

      - name: Update interactive languages & repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_METRICS_TOKEN: ${{ secrets.GH_METRICS_TOKEN }}
        run: python .github/scripts/update_languages.py

      - name: Validate all SVGs, READMEs & data
        run: python .github/scripts/validate_repo.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md README.en.md assets/ta assets/en
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily Thirukkural and GitHub activity"
          git push
